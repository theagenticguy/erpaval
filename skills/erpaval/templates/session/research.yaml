agent_id: research-<domain>
domain: <e.g., OAuth + PKCE libraries>
libraries:
  - name: <package name>
    version_pin: "^<major>.<minor>"
    grounded: true                      # true once version + api_surface are cited
    retrieved_via: context7             # context7 | deepwiki | exa | brave | nova | web
    sources:                            # ≥1 current-docs URL — required when grounded: true
      - <url to the version/API source>
    api_surface:
      - <namespaced API path>
    breaking_changes: <summary of relevant changes>
    security_notes:
      - <note>
